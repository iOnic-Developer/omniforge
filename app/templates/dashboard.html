<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniForge</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85f2f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); }
    header h1 { font-size:20px; margin:0; }
    header .tag { color:var(--muted); font-size:13px; }
    .wrap { display:grid; grid-template-columns:320px 1fr; gap:20px; padding:24px; max-width:1400px; margin:0 auto; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
    .panel h2 { margin:0 0 12px; font-size:15px; }
    .tool-list { list-style:none; padding:0; margin:0; max-height:60vh; overflow:auto; }
    .tool-list li { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:1px solid transparent; border-radius:6px; cursor:pointer; margin-bottom:4px; }
    .tool-list li:hover, .tool-list li.active { border-color:var(--accent); background:#1c2128; }
    .tool-list .name { font-weight:500; }
    .tool-list .lang { color:var(--muted); font-size:12px; }
    .badge { font-size:11px; padding:2px 8px; border-radius:10px; }
    .badge.on { background:#1a3a1e; color:var(--green); }
    .badge.off { background:#3a1f1f; color:var(--red); }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
    input, select, textarea { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; font-size:14px; }
    textarea { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    button { cursor:pointer; border:none; border-radius:6px; padding:9px 16px; font-size:14px; font-weight:500; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    .btn-danger { background:transparent; color:var(--red); border:1px solid var(--red); }
    .actions { display:flex; gap:8px; margin-top:16px; }
    .out { margin-top:12px; }
    .out pre { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:12px; white-space:pre-wrap; max-height:300px; overflow:auto; }
    .out .ok { color:var(--green); }
    .out .err { color:var(--red); }
    .empty { color:var(--muted); font-size:13px; }
    .close-x { color:var(--muted); cursor:pointer; font-size:16px; }
    .close-x:hover { color:var(--red); }
    dialog { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; width:min(760px, 95vw); max-height:85vh; overflow:auto; }
    dialog::backdrop { background:#000a; }
    dialog pre { white-space:pre-wrap; overflow-wrap:anywhere; }
    .hint { color:var(--muted); font-size:13px; }
    @media (max-width:700px) { .wrap { grid-template-columns:1fr; padding:12px; } }

  </style>
</head>
<body>
  <header>
    <div>
      <h1>🛠️ OmniForge</h1>
      <div class="tag">Write, test, and deploy scripts as live MCP tools</div>
    </div>
    <button type="button" class="btn-ghost" id="configBtn">Config</button>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>Tools</h2>
      <button type="button" class="btn-ghost" id="exampleBtn">Load working example</button>
      <p class="hint">Example uses Python's standard library. Save it, then Run / Test. Print JSON to return output.</p>
      <ul class="tool-list" id="toolList"></ul>
    </div>

    <div class="panel">
      <h2>
        <span id="formTitle">New Tool</span>
        <span class="close-x" id="closeForm" style="float:right;display:none">×</span>
      </h2>
      <form id="toolForm">
        <div class="row">
          <div>
            <label>Tool Name</label>
            <input name="name" placeholder="e.g. weather" required>
          </div>
          <div>
            <label>Language</label>
            <select name="language">
              <option value="python3">Python</option>
              <option value="node">Node.js</option>
            </select>
          </div>
        </div>
        <label>Description</label>
        <input name="description" placeholder="What does this tool do?">
        <label>Code</label>
        <textarea name="code" rows="12" placeholder="# Print the current date&#10;import datetime&#10;print(datetime.date.today())"></textarea>
        <label>Requirements (one per line, optional)</label>
        <textarea name="requirements" rows="2" placeholder="requests&#10;pandas"></textarea>
        <div class="actions">
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-ghost" id="runBtn">Run / Test</button>
          <button type="button" class="btn-danger" id="delBtn" style="display:none">Delete</button>
        </div>
      </form>
      <div class="out" id="out" style="display:none"></div>
    </div>
  </div>

  <dialog id="configDialog">
    <div class="row"><h2>MCP configuration &amp; connections</h2><button type="button" class="btn-ghost" id="closeConfig">Close</button></div>
    <div id="configContent"></div>
  </dialog>

  <script>
    let current = null;
    const el = (s) => document.querySelector(s);
    const val = (name) => el(`[name="${name}"]`).value;

    async function api(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch { throw new Error(`HTTP ${res.status}: ${text.slice(0, 200) || 'Empty response'}`); }
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || data)}`);
      return data;
    }

    function showOutput(message, error = false) {
      const out = el('#out');
      out.style.display = 'block';
      const pre = document.createElement('pre');
      pre.className = error ? 'err' : 'ok';
      pre.textContent = message;
      out.replaceChildren(pre);
    }

    function resetForm() {
      current = null;
      el('#toolForm').reset();
      el('#formTitle').textContent = 'New Tool';
      el('#closeForm').style.display = 'none';
      el('#delBtn').style.display = 'none';
    }

    async function loadTools() {
      const { tools } = await api('/api/tools');
      const list = el('#toolList'); list.replaceChildren();
      if (!tools.length) {
        const li = document.createElement('li');
        li.className = 'empty'; li.textContent = 'No tools yet — load the example or create one.';
        list.appendChild(li);
      }
      tools.forEach(t => {
        const li = document.createElement('li');
        const name = document.createElement('span'); name.textContent = `${t.name} (${t.language})`;
        const badge = document.createElement('span'); badge.className = `badge ${t.is_active ? 'on' : 'off'}`;
        badge.textContent = t.is_active ? 'active' : 'off';
        li.append(name, badge); li.onclick = () => selectTool(t); list.appendChild(li);
      });
    }

    function selectTool(t) {
      current = t;
      el('#formTitle').textContent = 'Edit Tool';
      el('#closeForm').style.display = 'inline';
      el('#delBtn').style.display = 'inline-block';
      ['name', 'description', 'language', 'code'].forEach(key => { el(`[name="${key}"]`).value = t[key]; });
      el('[name="requirements"]').value = JSON.parse(t.requirements_json || '[]').join('\n');
      el('#out').style.display = 'none';
    }

    el('#exampleBtn').addEventListener('click', () => {
      if ((val('code') || val('name')) && !confirm('Replace the editor contents with the example? Saved tools are unchanged.')) return;
      resetForm();
      el('[name="name"]').value = 'example_hello';
      el('[name="description"]').value = 'Return a greeting and the current UTC time as JSON. No packages required.';
      el('[name="code"]').value = 'import json\nfrom datetime import datetime, timezone\n\nprint(json.dumps({\n    "message": "Hello from OmniForge!",\n    "utc_time": datetime.now(timezone.utc).isoformat(),\n    "ok": True\n}))\n';
      showOutput('Example loaded. Click Save, then Run / Test. This tool needs no requirements.');
    });

    el('#toolForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: val('name'), description: val('description'), language: val('language'), code: val('code'),
        requirements: val('requirements').split('\n').map(x => x.trim()).filter(Boolean),
        json_schema: current ? JSON.parse(current.json_schema_json || '{}') : {},
        is_active: current ? current.is_active : true
      };
      try {
        await api(current ? `/api/tools/${encodeURIComponent(current.name)}` : '/api/tools', {
          method: current ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        await loadTools();
        const { tools } = await api('/api/tools');
        selectTool(tools.find(t => t.name === body.name));
        showOutput('Saved. Click Run / Test to execute the saved code.');
      } catch (err) { showOutput(err.message, true); }
    });

    el('#runBtn').addEventListener('click', async () => {
      if (!current) { showOutput('Save or select a tool before running it.', true); return; }
      if (val('name') !== current.name || val('code') !== current.code || val('language') !== current.language) {
        showOutput('Save your changes before running this tool.', true); return;
      }
      const button = el('#runBtn'); button.disabled = true;
      showOutput('Running…');
      try {
        const d = await api(`/api/tools/${encodeURIComponent(current.name)}/run`, { method: 'POST' });
        showOutput(`${d.exit_code === 0 ? 'OK' : 'ERROR'} (exit ${d.exit_code}${d.timed_out ? ', timeout' : ''}, ${d.duration_ms} ms)\n\n${(d.stdout || '') + (d.stderr ? '\n' + d.stderr : '') || '(no output — use print() in Python or console.log() in Node)'}`, d.exit_code !== 0);
      } catch (err) { showOutput(err.message, true); }
      finally { button.disabled = false; }
    });

    el('#delBtn').addEventListener('click', async () => {
      if (!current || !confirm(`Delete tool "${current.name}"?`)) return;
      try {
        await api(`/api/tools/${encodeURIComponent(current.name)}`, { method: 'DELETE' });
        resetForm(); await loadTools();
      } catch (err) { showOutput(err.message, true); }
    });
    el('#closeForm').addEventListener('click', resetForm);

    el('#configBtn').addEventListener('click', async () => {
      const dialog = el('#configDialog'); const content = el('#configContent');
      content.textContent = 'Loading…'; dialog.showModal();
      try {
        const config = await api('/api/config');
        const endpoint = new URL(config.mcp_path, window.location.origin).href;
        const headers = config.auth_enabled ? { Authorization: 'Bearer <YOUR_API_KEY>' } : {};
        const template = { endpoint, method: 'POST', headers,
          body: { jsonrpc: '2.0', id: 1, method: 'tools/list', params: {} } };
        const pre = document.createElement('pre');
        pre.textContent = [
          `MCP endpoint: ${endpoint}`, `Transport: ${config.transport}`,
          `MCP authentication: ${config.auth_enabled ? 'Bearer API key enabled (value hidden)' : 'DISABLED'}`,
          config.auth_configuration,
          'Dashboard/API authentication: not implemented',
          'Connected clients: not tracked; no connection list is available',
          `Methods: ${config.methods.join(', ')}`,
          '', 'HTTP client request template (replace the key locally):', JSON.stringify(template, null, 2),
          '', 'Warnings:', ...config.warnings.map(w => `• ${w}`)
        ].join('\n');
        content.replaceChildren(pre);
      } catch (err) { content.textContent = err.message; }
    });
    el('#closeConfig').addEventListener('click', () => el('#configDialog').close());

    loadTools().catch(err => showOutput(err.message, true));
  </script>
</body>
</html>
