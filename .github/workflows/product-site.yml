name: Build product Pages site
on:
  push:
    branches: [main, 'docs/**']
    paths:
      - 'docs/**'
      - 'scripts/build-product-site.py'
      - 'requirements-docs.txt'
      - '.github/workflows/product-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation-only dependency
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r requirements-docs.txt
      - name: Build and validate public allowlist
        run: .venv-docs/bin/python scripts/build-product-site.py
      - name: Save downloadable static preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Prepare Pages artifact for a public repository only
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Explain private-repository result
        if: github.event.repository.private == true
        run: |
          echo '### Public-ready preview built; no site deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download pages-preview to inspect. Repository visibility was not changed. Private Pages is unavailable on the current plan; publishing requires an owner decision and a history/privacy review.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}site/
    steps:
      - name: Configure public GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy static documentation only
        id: deployment
        uses: actions/deploy-pages@v4
