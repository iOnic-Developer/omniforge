name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - app/**
      - .github/workflows/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dbzocchi/omniforge
          tags: |
            latest
            sha-${{ github.sha }}

      - name: Build and push
        uses: docker/bump-action@v1
        with:
          tags: dbzocchi/omniforge:latest
          file: Dockerfile
