services:
  omniforge:
    build: .
    image: ionic-developer/omniforge:latest
    container_name: omniforge
    ports:
      - "8000:8000"
    environment:
      OMNIFORGE_API_KEY: ${OMNIFORGE_API_KEY:-}
      OMNIFORGE_MAX_SCRIPT_TIMEOUT_MS: "30000"
      OMNIFORGE_MAX_SCRIPT_MEMORY_MB: "512"
      OMNIFORGE_RUNTIME_IMAGE: omniforge:latest
      OMNIFORGE_DB_PATH: /opt/omniforge/data/omniforge.db
      OMNIFORGE_LIB_ROOT: /opt/omniforge/lib
      OMNIFORGE_SCRIPT_HOST: /opt/omniforge/scripts
    volumes:
      - omniforge_data:/opt/omniforge/data
      - omniforge_lib:/opt/omniforge/lib
      - omniforge_scripts:/opt/omniforge/scripts
    # Ephemeral runtime containers spawned by the runner use these named volumes.
    # They are declared here so docker-compose creates them.
volumes:
  omniforge_data:
  omniforge_lib:
  omniforge_scripts:
