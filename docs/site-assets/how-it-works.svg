<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title"><title id="title">Create, test saved code, discover — OmniForge workflow</title><rect width="1600" height="560" fill="#f7f6ef"/><g transform="translate(48 40) scale(0.625)"><rect width="64" height="64" rx="4" fill="#116859"/><path fill="#f3f8f2" d="M16 16h32v10H26v12h12V28h10v20H16z"/></g><text x="106" y="69" font-family="Manrope" font-size="24" font-weight="750" fill="#153f36">OmniForge</text><text x="48" y="133" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#52645c">ORDINARY SCRIPTS. AN EXPLICIT WORKFLOW.</text><rect x="48" y="178" width="484" height="258" rx="4" fill="#fffef8" stroke="#9eafa0"/><text x="72" y="218" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#116859">01 / CREATE</text><text x="72" y="272" font-family="Manrope" font-size="27" font-weight="650" fill="#1e302a">Write one useful script.</text><text x="72" y="326" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#116859">Python or Node</text><text x="72" y="392" font-family="Manrope" font-size="16" font-weight="500" fill="#52645c">Named tool + package requirements</text><rect x="558" y="178" width="484" height="258" rx="4" fill="#fffef8" stroke="#9eafa0"/><text x="582" y="218" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#116859">02 / TEST SAVED</text><text x="582" y="272" font-family="Manrope" font-size="27" font-weight="650" fill="#1e302a">Inspect what actually ran.</text><text x="582" y="326" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#116859">JSON input → stdout</text><text x="582" y="392" font-family="Manrope" font-size="16" font-weight="500" fill="#52645c">Save first. Review errors and timing.</text><rect x="1068" y="178" width="484" height="258" rx="4" fill="#153f36" stroke="#9eafa0"/><text x="1092" y="218" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#d9e6bb">03 / DISCOVER</text><text x="1092" y="272" font-family="Manrope" font-size="27" font-weight="650" fill="#f5f7ec">Let a client find the tool.</text><text x="1092" y="326" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#d9e6bb">POST /mcp · tools/list</text><text x="1092" y="392" font-family="Manrope" font-size="16" font-weight="500" fill="#c2d5c8">Limited HTTP JSON-RPC; check your client.</text><text x="48" y="504" font-family="Manrope" font-size="15" font-weight="500" fill="#52645c">Trusted LAN only. Dashboard and management API are unauthenticated. Scripts share the application container.</text></svg>
